<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cabinet of Dreams</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <video id="bg-video" autoplay muted loop playsinline>
    <source src="Picnic Video Background.mp4" type="video/mp4">
  </video>
  <img class="gif-overlay" src="sleeping character picnic 4.gif" alt="">
  <img class="gif-overlay" src="sleepingcharacterpicnic1.gif" alt="">
  <img class="gif-overlay" src="sleepingcharacterpicnic2.gif" alt="">
  <img class="gif-overlay" src="sleepingcharacterpicnic33.gif" alt="">
  <audio id="ambience" loop>
    <source src="Summertime Ambience--ambience_birds_chirping_summer.mp3" type="audio/mpeg">
  </audio>

  <div id="video-modal">
    <div id="modal-overlay"></div>
    <div id="modal-container">
      <video id="modal-video" loop playsinline></video>
    </div>
    <button id="modal-close" onclick="closeModal()">✕</button>
  </div>

  <p id="hint">Click on a character to see inside their dream.</p>

  <div id="intro">
    <video id="intro-video" preload="auto" playsinline>
      <source src="DreamCabinet_Intro.mp4" type="video/mp4">
    </video>
    <img id="play-btn" src="playbutton_0000_Layer-4.png" alt="Play">
  </div>

  <div id="outro">
    <video id="outro-video" playsinline>
      <source src="DreamCabinet_Outro.mp4" type="video/mp4">
    </video>
    <img id="play-again-btn" src="playAgainButton.png" alt="Play Again">
  </div>

  <script>
    const canvasCache = new Map();
    let modalOpen = false;
    const ambience = document.getElementById('ambience');
    const watchedDreams = new Set();
    let currentDreamKey = null;
    const TOTAL_DREAMS = 4;

    document.querySelectorAll('.gif-overlay').forEach(img => {
      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d', { willReadFrequently: true });
      canvasCache.set(img, { canvas, ctx });
    });

    function sampleAlpha(img, clientX, clientY) {
      const { canvas, ctx } = canvasCache.get(img);
      canvas.width = img.naturalWidth;
      canvas.height = img.naturalHeight;
      ctx.drawImage(img, 0, 0);
      const rect = img.getBoundingClientRect();
      const x = Math.floor((clientX - rect.left) * (img.naturalWidth / rect.width));
      const y = Math.floor((clientY - rect.top) * (img.naturalHeight / rect.height));
      return ctx.getImageData(x, y, 1, 1).data[3];
    }

    document.addEventListener('mousemove', (e) => {
      if (modalOpen) return;
      canvasCache.forEach((_, img) => {
        const alpha = sampleAlpha(img, e.clientX, e.clientY);
        img.classList.toggle('glow', alpha > 10);
      });
    });

    document.addEventListener('mouseleave', () => {
      document.querySelectorAll('.gif-overlay').forEach(img => img.classList.remove('glow'));
    });

    // Intro screen
    const intro = document.getElementById('intro');
    const introVideo = document.getElementById('intro-video');
    const playBtn = document.getElementById('play-btn');

    introVideo.addEventListener('loadedmetadata', () => {
      introVideo.currentTime = 0.01;
    });

    playBtn.addEventListener('click', () => {
      playBtn.style.display = 'none';
      ambience.play();
      introVideo.play();
    });

    document.addEventListener('keydown', (e) => {
      if (e.code !== 'Space') return;
      const introEl = document.getElementById('intro');
      if (!introEl || playBtn.style.display !== 'none') return;
      e.preventDefault();
      introVideo.pause();
      introEl.classList.add('hiding');
      introEl.addEventListener('transitionend', () => {
        introEl.remove();
        setTimeout(() => document.getElementById('hint').classList.add('visible'), 400);
      }, { once: true });
    });

    introVideo.addEventListener('ended', () => {
      intro.classList.add('hiding');
      intro.addEventListener('transitionend', () => {
        intro.remove();
        setTimeout(() => document.getElementById('hint').classList.add('visible'), 400);
      }, { once: true });
    });

    // Modal logic
    const modal = document.getElementById('video-modal');
    const modalContainer = document.getElementById('modal-container');
    const modalOverlay = document.getElementById('modal-overlay');
    const modalVideo = document.getElementById('modal-video');
    const gif33 = document.querySelector('img[src="sleepingcharacterpicnic33.gif"]');
    const gif4 = document.querySelector('img[src="sleeping character picnic 4.gif"]');
    const gif2 = document.querySelector('img[src="sleepingcharacterpicnic2.gif"]');
    const gif1 = document.querySelector('img[src="sleepingcharacterpicnic1.gif"]');

    document.addEventListener('click', (e) => {
      if (modalOpen || document.getElementById('intro')) return;
      if (sampleAlpha(gif33, e.clientX, e.clientY) > 10) {
        openModal('Dream Cabinet Carly Final.mp4', 'carly');
      } else if (sampleAlpha(gif4, e.clientX, e.clientY) > 10) {
        openModal('BodyDysphoria_InteractiveAnimation.mp4', 'body');
      } else if (sampleAlpha(gif2, e.clientX, e.clientY) > 10) {
        openModal('DreamCabinet_finalv3.mp4', 'final');
      } else if (sampleAlpha(gif1, e.clientX, e.clientY) > 10) {
        openModal('mollydream.mp4', 'molly');
      }
    });

    function openModal(src, dreamKey) {
      currentDreamKey = dreamKey;
      const hint = document.getElementById('hint');
      if (hint) hint.classList.remove('visible');
      modalVideo.src = src;
      modalOpen = true;
      ambience.pause();
      document.querySelectorAll('.gif-overlay').forEach(img => img.style.visibility = 'hidden');
      modal.style.display = 'flex';
      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          modalContainer.classList.add('expanded');
        });
      });
      modalContainer.addEventListener('transitionend', () => {
        modalVideo.play();
      }, { once: true });
    }

    function closeModal() {
      modalVideo.pause();
      modalVideo.currentTime = 0;
      modalContainer.classList.remove('expanded');
      modalContainer.addEventListener('transitionend', () => {
        modal.style.display = 'none';
        document.querySelectorAll('.gif-overlay').forEach(img => img.style.visibility = 'visible');
        modalOpen = false;

        if (currentDreamKey) {
          watchedDreams.add(currentDreamKey);
          currentDreamKey = null;
        }

        if (watchedDreams.size >= TOTAL_DREAMS) {
          playOutro();
        } else {
          ambience.play();
        }
      }, { once: true });
    }

    function playOutro() {
      const outro = document.getElementById('outro');
      const outroVideo = document.getElementById('outro-video');
      requestAnimationFrame(() => {
        outro.classList.add('visible');
        outroVideo.play();
      });
      outroVideo.addEventListener('ended', () => {
        document.getElementById('play-again-btn').classList.add('visible');
      }, { once: true });
    }

    document.getElementById('play-again-btn').addEventListener('click', () => {
      location.reload();
    });

    modalOverlay.addEventListener('click', closeModal);
  </script>
</body>
</html>
